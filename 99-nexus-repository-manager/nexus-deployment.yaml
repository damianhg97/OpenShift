apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  labels:
    app: nexus
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: nexus

  template:
    metadata:
      labels:
        app: nexus

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nexus
          image: sonatype/nexus3:3.90.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: >-
                -Djava.util.prefs.userRoot=/nexus-data/javaprefs

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi

          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data

      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-pvc