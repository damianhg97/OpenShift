# Job tạo schema "keycloak" trong database banking (Keycloak dùng KC_DB_SCHEMA=keycloak)
# Chạy SAU khi Postgres ready, TRƯỚC khi start Keycloak.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-init
  namespace: khoadghg97-dev
  labels:
    app: keycloak-db-init
    app.kubernetes.io/part-of: banking-platform
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: keycloak-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-client
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_DATABASE
          command:
            - /bin/bash
            - -ec
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h postgres -p 5432 -U "$POSTGRESQL_USER"; do
                sleep 2
              done
              echo "PostgreSQL is ready. Creating schema keycloak if not exists..."
              psql -h postgres -p 5432 -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE SCHEMA IF NOT EXISTS keycloak;
              GRANT ALL ON SCHEMA keycloak TO CURRENT_USER;
              SQL
              echo "Schema keycloak ready."
