apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: keycloak-db-init
    spec:
      restartPolicy: OnFailure

      containers:
        - name: postgres-client
          image: registry.redhat.io/rhel9/postgresql-16:latest

          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_PASSWORD

            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_USER

          command:
            - /bin/bash
            - -ec
            - |
              until pg_isready \
                -h postgres \
                -p 5432 \
                -U "$POSTGRESQL_USER"
              do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              psql \
                -h postgres \
                -p 5432 \
                -U "$POSTGRESQL_USER" \
                -d corporate_banking \
                -v ON_ERROR_STOP=1 \
                <<'SQL'
              DO
              $$
              BEGIN
                IF NOT EXISTS (
                  SELECT FROM pg_catalog.pg_roles
                  WHERE rolname = 'keycloak'
                ) THEN
                  CREATE ROLE keycloak LOGIN PASSWORD 'change-me';
                END IF;
              END
              $$;

              SELECT 'CREATE DATABASE keycloak OWNER keycloak'
              WHERE NOT EXISTS (
                SELECT FROM pg_database WHERE datname = 'keycloak'
              )
              \gexec

              GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
              SQL