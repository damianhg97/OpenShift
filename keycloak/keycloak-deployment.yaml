apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      labels:
        app: keycloak

    spec:
      containers:
        - name: keycloak

          image: quay.io/keycloak/keycloak:26.3.2
          imagePullPolicy: IfNotPresent

          args:
            - start

          ports:
            - name: http
              containerPort: 8080

            - name: management
              containerPort: 9000

          env:
            # -------------------------------------------------
            # Database
            # -------------------------------------------------

            - name: KC_DB
              value: postgres

            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/banking

            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_USER

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRESQL_PASSWORD

            - name: KC_DB_SCHEMA
              value: keycloak

            # -------------------------------------------------
            # Bootstrap admin
            # -------------------------------------------------

            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KC_BOOTSTRAP_ADMIN_USERNAME

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD

            # -------------------------------------------------
            # HTTP / OpenShift Route
            # -------------------------------------------------

            - name: KC_HTTP_ENABLED
              value: "true"

            - name: KC_PROXY_HEADERS
              value: xforwarded

            - name: KC_HOSTNAME_STRICT
              value: "false"

            # -------------------------------------------------
            # Health
            # -------------------------------------------------

            - name: KC_HEALTH_ENABLED
              value: "true"

          resources:
            requests:
              cpu: 100m
              memory: 750Mi

            limits:
              cpu: 500m
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /health/started
              port: management

            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health/ready
              port: management

            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health/live
              port: management

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6