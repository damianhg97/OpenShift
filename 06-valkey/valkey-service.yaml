# ==============================================================================
# Valkey Service
# ==============================================================================
# ClusterIP Service để các service nội bộ (customer-service) kết nối đến Valkey.
# Không tạo Route vì Valkey chỉ dùng internal, không expose ra ngoài cluster.
# customer-service sẽ kết nối qua: valkey:6379
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: khoadghg97-dev
  labels:
    app: valkey
    app.kubernetes.io/part-of: banking-platform
spec:
  type: ClusterIP
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
      protocol: TCP