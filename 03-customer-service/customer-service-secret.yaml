apiVersion: v1
kind: Secret
metadata:
  name: customer-service-secret
  namespace: khoadghg97-dev
  labels:
    app: customer-service
    app.kubernetes.io/part-of: banking-platform
type: Opaque
stringData:
  # Cùng user/password với Postgres (hoặc tạo user riêng nếu muốn)
  SPRING_DATASOURCE_USERNAME: banking
  SPRING_DATASOURCE_PASSWORD: "change-me"
  # M2M client credentials để customer-service gọi Zeebe API (Camunda Identity /
  # Keycloak realm "camunda-platform"). Client-id/secret dưới đây là GIÁ TRỊ CHUẨN
  # do Claude chọn — bạn PHẢI tạo client trùng khớp trong Keycloak (xem hướng dẫn),
  # và nên tự generate lại secret thay vì giữ nguyên giá trị mẫu này khi lên production.
  CAMUNDA_CLIENT_AUTH_CLIENT_ID: "customer-service"
  CAMUNDA_CLIENT_AUTH_CLIENT_SECRET: "twHQ2cg3Lzqj900GgjEYKKd9ATrbNm0w"
