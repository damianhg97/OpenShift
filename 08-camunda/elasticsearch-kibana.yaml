# =============================================================================
# Elasticsearch 8.19.20 + Kibana 8.19.20 – Camunda 8.6 secondary storage
# Namespace: khoadghg97-dev | OpenShift restricted-v2
# Security OFF (tránh probe 401) | Camunda 8.6 cần ES 8.13+
# =============================================================================

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: banking-platform
    app.kubernetes.io/component: secondary-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: banking-platform
    app.kubernetes.io/component: secondary-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: camunda
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: banking-platform
        app.kubernetes.io/component: secondary-storage
    spec:
      serviceAccountName: elasticsearch
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          env:
            - name: discovery.type
              value: single-node
            - name: cluster.name
              value: camunda-es
            - name: node.name
              value: elasticsearch-0
            - name: network.host
              value: "0.0.0.0"
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: xpack.ml.enabled
              value: "false"
            - name: ingest.geoip.downloader.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "false"
          resources:
            requests:
              cpu: "400m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: logs
              mountPath: /usr/share/elasticsearch/logs
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: 9200
              scheme: HTTP
            initialDelaySeconds: 50
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: banking-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: 9300
      protocol: TCP
  selector:
    app.kubernetes.io/name: elasticsearch

---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: banking-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP
  selector:
    app.kubernetes.io/name: elasticsearch

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: elasticsearch
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: banking-platform
spec:
  to:
    kind: Service
    name: elasticsearch
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: banking-platform
    app.kubernetes.io/component: secondary-storage-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app: camunda
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: banking-platform
        app.kubernetes.io/component: secondary-storage-ui
    spec:
      serviceAccountName: elasticsearch
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.20
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
              protocol: TCP
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "5601"
            - name: XPACK_SECURITY_ENABLED
              value: "false"
            - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
              value: "camunda-sandbox-kibana-encryption-key-32chars"
            - name: TELEMETRY_ENABLED
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /usr/share/kibana/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: banking-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5601
      targetPort: 5601
      protocol: TCP
  selector:
    app.kubernetes.io/name: kibana

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kibana
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: banking-platform
spec:
  to:
    kind: Service
    name: kibana
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect