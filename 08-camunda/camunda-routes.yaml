# =============================================================================
# OpenShift Routes cho Camunda 8 UI components
# Project: Kevin Bank - Banking Platform
# Namespace: khoadghg97-dev
# =============================================================================
# Host pattern OpenShift Developer Sandbox:
#   <route-name>-<namespace>.apps.<cluster-domain>
# Bạn có thể để trống host → OpenShift tự generate.
# TLS: edge + Redirect (phổ biến trên Sandbox)
# =============================================================================

---
# Route Operate UI
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: camunda-operate
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: operate
    app.kubernetes.io/part-of: banking-platform
    app.kubernetes.io/component: ui
spec:
  # Để trống host → OpenShift tự tạo
  # host: camunda-operate-khoadghg97-dev.apps.sandbox.xxxxxx
  to:
    kind: Service
    name: camunda-operate          # tên service do Helm chart tạo
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

