---
# Route Zeebe Gateway (gRPC) – tùy chọn, cần HTTP/2
# Trên Sandbox có thể không hỗ trợ gRPC tốt qua Route edge.
# Thường dùng port-forward hoặc Service nội bộ cho worker.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: camunda-zeebe-gateway
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: zeebe-gateway
    app.kubernetes.io/part-of: banking-platform
    app.kubernetes.io/component: gateway
  annotations:
    # Một số cluster hỗ trợ h2c
    haproxy.router.openshift.io/balance: roundrobin
spec:
  to:
    kind: Service
    name: camunda-zeebe-gateway
    weight: 100
  port:
    targetPort: gateway   # hoặc http / grpc tùy chart version
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
