# =============================================================================
# Camunda 8.6 Self-Managed Helm Values — FIX v3 (đúng key Connectors)
# Chart: camunda/camunda-platform 11.3.0
# =============================================================================

global:
  compatibility:
    openshift:
      adaptSecurityContext: force

  labels:
    app: camunda
    app.kubernetes.io/part-of: banking-platform

  ingress:
    enabled: false

  identity:
    auth:
      enabled: true
      publicIssuerUrl: "https://keycloak-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com/realms/camunda-platform"
      issuerBackendUrl: "http://keycloak:8080/realms/camunda-platform"
      authUrl: "http://keycloak:8080/realms/camunda-platform/protocol/openid-connect/auth"
      tokenUrl: "http://keycloak:8080/realms/camunda-platform/protocol/openid-connect/token"
      jwksUrl: "http://keycloak:8080/realms/camunda-platform/protocol/openid-connect/certs"

      operate:
        existingSecret:
          name: camunda-identity-secret
        existingSecretKey: operate-client-secret
        redirectUrl: "https://camunda-operate-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com/operate"

      tasklist:
        existingSecret:
          name: camunda-identity-secret
        existingSecretKey: tasklist-client-secret
        redirectUrl: "https://camunda-tasklist-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com/tasklist"

      connectors:
        existingSecret:
          name: camunda-identity-secret
        existingSecretKey: connectors-client-secret

      zeebe:
        existingSecret:
          name: camunda-identity-secret
        existingSecretKey: zeebe-client-secret

    keycloak:
      url:
        protocol: http
        host: keycloak
        port: "8080"
      contextPath: "/"
      realm: "/realms/camunda-platform"
      auth:
        adminUser: admin
        existingSecret: keycloak-secret
        existingSecretKey: KC_BOOTSTRAP_ADMIN_PASSWORD

  elasticsearch:
    enabled: true
    url:
      protocol: http
      host: elasticsearch
      port: 9200
  opensearch:
    enabled: false

elasticsearch:
  enabled: false
  commonLabels: {}

identityKeycloak:
  enabled: false

identityPostgresql:
  enabled: false

webModelerPostgresql:
  enabled: false

postgresql:
  enabled: false

# -----------------------------------------------------------------------------
identity:
  enabled: true
  contextPath: /identity
  firstUser:
    username: demo
    existingSecret: camunda-identity-secret
    existingSecretKey: first-user-password
  externalDatabase:
    enabled: true
    host: postgres
    port: 5432
    username: banking
    database: identity
    secret:
      existingSecret: postgres-secret
      existingSecretKey: POSTGRESQL_PASSWORD
  env:
    - name: KEYCLOAK_REALM
      value: "camunda-platform"
# -----------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ZEEBE BROKER
# ---------------------------------------------------------------------------
zeebe:
  clusterSize: 1
  partitionCount: 1
  replicationFactor: 1
  pvcSize: 4Gi
  resources:
    requests:
      cpu: 150m
      memory: 800Mi
    limits:
      cpu: 1000m
      memory: 1500Mi
  env:
    - name: ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE
      value: "100"

zeebeGateway:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
operate:
  enabled: true
  contextPath: /operate
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
    - name: CAMUNDA_OPERATE_ELASTICSEARCH_URL
      value: http://elasticsearch:9200
    - name: CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL
      value: http://elasticsearch:9200

# ---------------------------------------------------------------------------
tasklist:
  enabled: true
  contextPath: /tasklist
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
    - name: CAMUNDA_TASKLIST_ELASTICSEARCH_URL
      value: http://elasticsearch:9200
    - name: CAMUNDA_TASKLIST_ZEEBEELASTICSEARCH_URL
      value: http://elasticsearch:9200

# ---------------------------------------------------------------------------
# CONNECTORS
# ---------------------------------------------------------------------------
# FIX v3: Dùng key đúng theo Camunda 8.6 docs để tắt Operate client.
#         Key cũ CAMUNDA_CLIENT_OPERATE_ENABLED không có tác dụng.
# ---------------------------------------------------------------------------
connectors:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    # Key đúng theo Camunda 8.6 Self-Managed docs
    - name: OPERATE_CLIENT_ENABLED
      value: "false"
    # Tắt luôn polling inbound để chắc ăn
    - name: CAMUNDA_CONNECTOR_POLLING_ENABLED
      value: "false"

optimize:
  enabled: false

webModeler:
  enabled: false

console:
  enabled: false