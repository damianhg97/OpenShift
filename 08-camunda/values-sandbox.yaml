# values-sandbox.yaml
# Camunda 8.9 trên OpenShift Developer Sandbox
# Namespace: khoadghg97-dev

global:
  compatibility:
    openshift:
      adaptSecurityContext: force

  security:
    authentication:
      method: oidc

  elasticsearch:
    enabled: true

  identity:
    auth:
      enabled: true
      # Keycloak public URL
      publicIssuerUrl: "https://camunda-keycloak-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com/auth/realms/camunda-platform"

      # Redirect URLs
      identity:
        redirectUrl: "https://camunda-identity-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com"
      operate:
        redirectUrl: "https://camunda-orchestration-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com/operate"
      tasklist:
        redirectUrl: "https://camunda-orchestration-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com/tasklist"
      orchestration:
        redirectUrl: "https://camunda-orchestration-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com"

# ====================== Orchestration Cluster ======================
orchestration:
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
  # QUAN TRỌNG — thiếu block này thì Orchestration Cluster (Zeebe Gateway/API)
  # mặc định chạy Basic Auth (theo Helm chart), KHÔNG chấp nhận Bearer JWT dù
  # global.identity.auth.enabled=true (block đó chỉ cấu hình Management
  # Identity/Keycloak, không tự bật OIDC cho Zeebe Gateway). Đây chính là
  # nguyên nhân lỗi "Authentication object not found in SecurityContext".
  # Cấu hình này đúng theo tài liệu chính thức "Helm chart internal Keycloak
  # setup" (docs.camunda.io, Camunda 8.8+) — dùng đúng key
  # identity-orchestration-client-token đã có sẵn trong camunda-credentials.yaml.
  security:
    authentication:
      method: oidc
      oidc:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token
        # QUAN TRỌNG — thiếu key này thì chart dùng mặc định
        # http://localhost:8080, rồi tự nối thêm /sso-callback, khiến
        # Keycloak callback về localhost thay vì domain OpenShift thật.
        # Chart sẽ tự nối thêm /sso-callback vào giá trị này.
        redirectUrl: "https://camunda-orchestration-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com"
  data:
    secondaryStorage:
      type: elasticsearch
  resources:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: 600m
      memory: 1280Mi

# ====================== Components ======================
operate:
  enabled: true

tasklist:
  enabled: true

identity:
  enabled: true
  contextPath: "/"
  fullURL: "https://camunda-identity-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com"
  firstUser:
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-firstuser-password
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

connectors:
  enabled: false

optimize:
  enabled: false

webModeler:
  enabled: false

console:
  enabled: false

# ====================== Elasticsearch ======================
elasticsearch:
  enabled: true
  master:
    replicaCount: 1
    heapSize: 512m
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: 400m
        memory: 1280Mi
    persistence:
      size: 8Gi
  sysctlImage:
    enabled: false
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0

# ====================== Identity PostgreSQL ======================
identityPostgresql:
  enabled: true
  auth:
    existingSecret: camunda-credentials
    secretKeys:
      adminPasswordKey: identity-postgresql-admin-password
      userPasswordKey: identity-postgresql-user-password
  primary:
    resources:
      requests:
        cpu: 80m
        memory: 192Mi
      limits:
        cpu: 200m
        memory: 384Mi
    persistence:
      size: 4Gi

# ====================== Keycloak ======================
identityKeycloak:
  enabled: true
  auth:
    existingSecret: camunda-credentials
    passwordSecretKey: identity-keycloak-admin-password
  postgresql:
    auth:
      existingSecret: camunda-credentials
      secretKeys:
        adminPasswordKey: identity-keycloak-postgresql-admin-password
        userPasswordKey: identity-keycloak-postgresql-user-password
    primary:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 150m
          memory: 256Mi
      persistence:
        size: 3Gi
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 300m
      memory: 768Mi
  # Quan trọng: hostname công khai
  extraEnvVars:
    - name: KC_HOSTNAME
      value: "camunda-keycloak-khoadghg97-dev.apps.rm3.7wse.p1.openshiftapps.com"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "false"
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_PROXY
      value: "edge"