# =============================================================================
# Job tạo schema/DB cho Camunda – dùng user postgres (học tập)
# Namespace: khoadghg97-dev
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: camunda-postgres-schema
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/name: camunda-postgres-schema
    app.kubernetes.io/part-of: banking-platform
    app.kubernetes.io/component: setup
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: camunda
        app.kubernetes.io/name: camunda-postgres-schema
        app.kubernetes.io/part-of: banking-platform
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-schema
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            # Superuser – học tập (đổi password nếu khác)
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              value: postgres
            - name: PGDATABASE
              value: postgres
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "==> Waiting for PostgreSQL..."
              until psql -c "SELECT 1" > /dev/null 2>&1; do
                echo "not ready, sleep 5s..."
                sleep 5
              done
              echo "==> PostgreSQL is ready (user=postgres)."

              echo "==> Ensuring database 'identity' exists..."
              DB_EXISTS=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='identity'")
              if [ "$DB_EXISTS" != "1" ]; then
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE identity OWNER banking;"
                echo "Database 'identity' created."
              else
                echo "Database 'identity' already exists."
              fi

              echo "==> Schema camunda in database banking..."
              PGDATABASE=banking psql -v ON_ERROR_STOP=1 <<'SQL'
              CREATE SCHEMA IF NOT EXISTS camunda;
              GRANT ALL ON SCHEMA camunda TO banking;
              GRANT USAGE ON SCHEMA camunda TO banking;
              ALTER DEFAULT PRIVILEGES IN SCHEMA camunda GRANT ALL ON TABLES TO banking;
              ALTER DEFAULT PRIVILEGES IN SCHEMA camunda GRANT ALL ON SEQUENCES TO banking;
              GRANT ALL ON SCHEMA public TO banking;
              SQL

              echo "==> Privileges on database identity..."
              PGDATABASE=identity psql -v ON_ERROR_STOP=1 <<'SQL'
              GRANT ALL ON SCHEMA public TO banking;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO banking;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO banking;
              SQL

              echo "==> Done."
              psql -c "\l" | grep -E 'banking|identity|Name' || true
              PGDATABASE=banking psql -c "\dn"