# =============================================================================
# Secret chứa các client secret cho Camunda Identity / OIDC
# Project: Kevin Bank - Banking Platform
# Namespace: khoadghg97-dev
# =============================================================================
# Sau khi Job camunda-keycloak-client chạy thành công, bạn có thể
# cập nhật giá trị identity-client-secret = camunda-secret-123
# (hoặc secret thực tế đã tạo trong Keycloak).
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: camunda-identity-secret
  namespace: khoadghg97-dev
  labels:
    app: camunda
    app.kubernetes.io/part-of: banking-platform
type: Opaque
stringData:
  # Các secret riêng cho từng component (có thể dùng cùng giá trị cho sandbox)
  # Identity sẽ tự tạo các client operate/tasklist/connectors/zeebe trong realm
  # "camunda-platform" mới và gán đúng secret theo các giá trị dưới đây.
  operate-client-secret: "camunda-secret-123"
  tasklist-client-secret: "camunda-secret-123"
  connectors-client-secret: "camunda-secret-123"
  zeebe-client-secret: "camunda-secret-123"
  # Password user demo đầu tiên của Identity
  first-user-password: "demo"
